version: 2

project_name: alpacon

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X github.com/alpacax/alpacon-cli/utils.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
      - goos: windows
        goarch: 386

checksum:
  name_template: '{{ .ProjectName }}-{{ trimprefix .Version "v" }}-checksums.sha256'
  # The install script is executed as it is downloaded, so its hash belongs in
  # the same file as the archives' hashes.
  extra_files:
    - glob: ./install.ps1

archives:
  - name_template: '{{ .ProjectName }}-{{ trimprefix .Version "v" }}-{{ .Os }}-{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]

brews:
  - name: alpacon-cli
    repository:
      owner: alpacax
      name: homebrew-alpacon
    commit_author:
      name: alpacaxbot
      email: support@alpacax.com
    directory: Formula
    homepage: "https://github.com/alpacax/alpacon-cli"
    description: "Command-line client for Alpacon (Websh, exec, file transfer, tunnels)"

dockers:
  - goos: linux
    goarch: amd64
    ids:
      - alpacon
    image_templates:
      - "alpacax/alpacon-cli:latest"
      - 'alpacax/alpacon-cli:{{ trimprefix .Tag "v" }}'
    dockerfile: Dockerfile

nfpms:
  - file_name_template: '{{ .PackageName }}_{{ trimprefix .Version "v" }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    maintainer: AlpacaX <support@alpacax.com>
    description: |
      Command-line client for Alpacon, the AI-native PAM. Drive your
      workspace from the terminal: open Websh terminal sessions directly
      in your shell, execute remote commands, transfer files, create TCP
      tunnels, and manage API tokens with command/server/file ACLs for
      CI/CD and AI agents.
    homepage: https://github.com/alpacax/alpacon-cli
    license: MIT
    vendor: AlpacaX
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin/

release:
  # create-release in .github/workflows/release.yaml leaves this tag a draft
  # titled with the tag. Looking a release up by tag never returns a draft,
  # so without use_existing_draft goreleaser made a second release and the
  # draft's notes were orphaned. It stays a draft: publish-release makes it
  # public once every job has succeeded.
  use_existing_draft: true
  mode: keep-existing
  draft: true
  # A re-run meets its own assets on the demoted draft; without this the first one stops the upload.
  replace_existing_artifacts: true
  # The only prerelease judgment: create-release passes no flag and publish-release reads this back.
  prerelease: auto
  # The Windows one-line installer is fetched from the release rather than from
  # a branch, so a user always runs the script that shipped with a tag.
  extra_files:
    - glob: ./install.ps1

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
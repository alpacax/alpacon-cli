name: Lint
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint (${{ matrix.goos }})
    runs-on: ubuntu-latest

    # The self-update path has a file per platform; linting one GOOS leaves the
    # other's unread.
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]

    env:
      GOOS: ${{ matrix.goos }}

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Allow Go toolchain auto-download
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Inlined instead of golang/govulncheck-action: it forces its own Go
      # version with GOTOOLCHAIN=local, so a tool cache behind go.mod fails.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Allow Go toolchain auto-download
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      # Blank GOOS/GOARCH so the tool is always built for the runner, even if
      # this job ever gains a cross-compilation matrix.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
        env:
          GOOS: ""
          GOARCH: ""

      - name: Run govulncheck
        run: govulncheck ./...

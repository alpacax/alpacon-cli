# install.ps1 ships as a release asset, so it gets a suite of its own.
name: Install script tests

on:
  push:
    branches: [main]
    paths:
      - "install.ps1"
      - "install.Tests.ps1"
      - ".github/workflows/install-script-tests.yaml"
      - ".github/scripts/run-installer-tests.ps1"
      - "PSScriptAnalyzerSettings.psd1"
      # The suite cross-checks these two against the documented download URL.
      - "README.md"
      - ".goreleaser.yaml"
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - "install.ps1"
      - "install.Tests.ps1"
      - ".github/workflows/install-script-tests.yaml"
      - ".github/scripts/run-installer-tests.ps1"
      - "PSScriptAnalyzerSettings.psd1"
      # The suite cross-checks these two against the documented download URL.
      - "README.md"
      - ".goreleaser.yaml"

  # release.yaml calls this before goreleaser, so no tag publishes an unseen install.ps1.
  workflow_call:

# Not github.workflow: under release.yaml it is "Release", shared with the other call.
# No cancel on a tag: a re-pushed tag would kill the run goreleaser is waiting on.
concurrency:
  group: install-script-tests-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # No `name:` on any job: the job id is the check context, so a leg reads `unit (powershell)`.
  # 5.1 and 7 parse and run the script differently, so the suite runs under both.
  unit:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # powershell is Windows PowerShell 5.1, pwsh is PowerShell 7.
        edition: [powershell, pwsh]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No matrix context in `shell:`, so the edition is the host this step launches.
      - name: Run Pester
        run: ${{ matrix.edition }} -NoProfile -File .github/scripts/run-installer-tests.ps1

  analyze:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        run: |
          # The runner image ships PSScriptAnalyzer too, so pin it on import.
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force
          $found = @(
            'install.ps1', 'install.Tests.ps1', 'PSScriptAnalyzerSettings.psd1',
            '.github/scripts/run-installer-tests.ps1' |
              ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings ./PSScriptAnalyzerSettings.psd1 }
          )
          $found | Format-Table RuleName,Severity,ScriptName,Line,Message -AutoSize | Out-String -Width 200 | Write-Host
          if ($found.Count -gt 0) { exit 1 }

  end-to-end:
    runs-on: windows-latest
    defaults:
      run:
        # Users have Windows PowerShell 5.1, so exercise the script there, not in 7.
        shell: powershell
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The script preserves the PATH value kind, so record it before installing.
      - name: Remember the install location and the user PATH value kind
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Alpacon\bin'
          $key = Get-Item HKCU:\Environment -ErrorAction SilentlyContinue
          $kind = if ($key -and $null -ne $key.GetValue('Path', $null)) { $key.GetValueKind('Path') } else { 'None' }
          Write-Host "user PATH value kind before install: $kind"
          # ascii, not utf8: Windows PowerShell writes a BOM for utf8, and this
          # is the first line in the file. Paths, a RegistryValueKind name and
          # the literal None are all ASCII.
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding ascii -Value @(
            "INSTALL_DIR=$dir"
            "INSTALL_EXE=$(Join-Path $dir 'alpacon.exe')"
            "PATH_KIND_BEFORE=$kind"
          )

      - name: Install from scratch
        run: ./install.ps1

      - name: The binary answers
        run: |
          if (-not (Test-Path $env:INSTALL_EXE)) { throw "alpacon.exe was not installed" }
          # alpacon prints on stderr, and capturing a native command's stderr
          # while $ErrorActionPreference is 'Stop' makes it terminating.
          $prior = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $reported = (& $env:INSTALL_EXE version 2>&1) | Out-String
          $ErrorActionPreference = $prior
          Write-Host $reported
          if ($reported -notmatch 'Current version') { throw "alpacon version said nothing: $reported" }

      - name: The user PATH kept its value kind and gained one entry
        run: |
          $key = Get-Item HKCU:\Environment
          $raw = $key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $kind = $key.GetValueKind('Path')
          # ExpandString only when the script had to create the value; otherwise
          # whatever kind was there must have survived.
          $expected = if ($env:PATH_KIND_BEFORE -eq 'None') { 'ExpandString' } else { $env:PATH_KIND_BEFORE }
          if ("$kind" -ne $expected) { throw "user PATH is $kind, expected $expected" }
          $hits = @($raw -split ';' | Where-Object { $_ -eq $env:INSTALL_DIR }).Count
          if ($hits -ne 1) { throw "install directory appears $hits times on PATH, expected 1" }

      # Both PATHs are emptied first because both are what a re-run repairs: the shell
      # can predate the install, the entry can be wiped by another installer.
      - name: Running it again reports it is already current and repairs both PATHs
        run: |
          $env:Path = (@($env:Path -split ';' | Where-Object { $_ -and $_ -ne $env:INSTALL_DIR }) -join ';')
          # -Type keeps the value kind the step above pinned; losing it here
          # would fail a later check for an unrelated reason.
          $key = Get-Item HKCU:\Environment
          $raw = $key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          Set-ItemProperty -Path HKCU:\Environment -Name Path -Type $key.GetValueKind('Path') `
            -Value (@($raw -split ';' | Where-Object { $_ -and $_ -ne $env:INSTALL_DIR }) -join ';')
          $output = ./install.ps1 6>&1 | Out-String
          if ($output -notmatch 'already') { throw "second run did not report an existing install: $output" }
          $hits = @($env:Path -split ';' | Where-Object { $_ -eq $env:INSTALL_DIR }).Count
          if ($hits -ne 1) { throw "the skipped run left this shell's PATH with $hits copies of $env:INSTALL_DIR, expected 1" }
          $after = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $hits = @($after -split ';' | Where-Object { $_ -eq $env:INSTALL_DIR }).Count
          if ($hits -ne 1) { throw "the skipped run left the user PATH with $hits copies of $env:INSTALL_DIR, expected 1" }

      - name: A missing binary is reinstalled without a second PATH entry
        run: |
          Remove-Item -LiteralPath $env:INSTALL_EXE
          ./install.ps1
          if (-not (Test-Path $env:INSTALL_EXE)) { throw "a quarantined binary was not reinstalled" }
          $raw = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $hits = @($raw -split ';' | Where-Object { $_ -eq $env:INSTALL_DIR }).Count
          if ($hits -ne 1) { throw "install directory appears $hits times on PATH, expected 1" }

      # Nothing special about 1.10.0: any older release with Windows archives does.
      - name: Pinning an older version installs that version
        run: |
          ./install.ps1 -Version 1.10.0
          $marker = Join-Path $env:INSTALL_DIR 'installed-version.txt'
          $got = (Get-Content $marker -Raw).Trim()
          if ($got -ne '1.10.0') { throw "version marker says '$got', expected '1.10.0'" }
          # The marker is what the script wrote about itself, so ask the binary
          # too. alpacon prints it on stderr, and capturing a native command's
          # stderr while $ErrorActionPreference is 'Stop' makes it terminating,
          # so relax that for this one call.
          $prior = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $reported = (& $env:INSTALL_EXE version 2>&1) | Out-String
          $ErrorActionPreference = $prior
          if ($reported -notmatch '1\.10\.0') { throw "alpacon reports '$reported', expected 1.10.0" }

      # -Version reading a variable nobody set arrives as an empty string, the shape a
      # pipeline hits. It must be refused: installing latest is what a pin rules out.
      - name: An empty -Version is refused instead of falling back to latest
        run: |
          $marker = Join-Path $env:INSTALL_DIR 'installed-version.txt'
          $before = (Get-Content $marker -Raw).Trim()
          $refused = $false
          try {
            ./install.ps1 -Version "$env:PINNED_VERSION_NOBODY_SET"
          } catch {
            if ("$_" -notlike '*is not a version number*') { throw }
            $refused = $true
          }
          if (-not $refused) { throw "install.ps1 accepted an empty -Version" }
          $after = (Get-Content $marker -Raw).Trim()
          if ($after -ne $before) { throw "the install went ahead anyway: the marker moved from '$before' to '$after'" }

      - name: A running binary is refused instead of overwritten
        run: |
          $before = (Get-FileHash $env:INSTALL_EXE).Hash
          $stream = [System.IO.File]::Open($env:INSTALL_EXE, 'Open', 'ReadWrite', 'None')
          try {
            $refused = $false
            try {
              ./install.ps1 -Force
            } catch {
              if ("$_" -notlike '*cannot be replaced*') { throw }
              $refused = $true
            }
            if (-not $refused) { throw "install.ps1 did not refuse to overwrite a locked binary" }
          } finally { $stream.Close() }
          if ((Get-FileHash $env:INSTALL_EXE).Hash -ne $before) { throw "the locked binary was replaced" }

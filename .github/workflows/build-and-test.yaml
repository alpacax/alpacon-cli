name: Build and Test
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

  workflow_call:

permissions:
  contents: read

jobs:
  # A matrix reports one check context per leg, and the org ruleset on main
  # requires the flat `build-and-test`. The job below is what reports it.
  test:
    runs-on: ${{ matrix.os }}

    # Windows and macOS each carry files every other platform compiles out, and
    # without a runner of their own those files ship untested: Windows holds the
    # ones that replace a running executable plus unzip_path.go's volume-name and
    # case-insensitive branches, which are unreachable on Unix, macOS the O_SEARCH
    # open that narrows a config directory it cannot read. macOS runs the whole
    # suite, which passes there unchanged, and is the only leg that exercises the
    # owner-refusal path—Linux will not let a test link a root-owned file into
    # place, so that case skips there. Windows runs only the packages holding its
    # own files: ./config is left out because every permission test in it skips on
    # Windows and its stubs are covered by compiling, not running.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: ./...
          - os: macos-latest
            packages: ./...
          - os: windows-latest
            packages: ./pkg/selfupdate/... ./cmd ./utils

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Allow Go toolchain auto-download
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Verify go.mod and go.sum are tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build -v .

      - name: Run Tests
        run: go test -race -v -shuffle=on ${{ matrix.packages }}

  # success only if every leg was.
  build-and-test:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail unless every matrix leg passed
        run: '[ "${{ needs.test.result }}" = "success" ]'

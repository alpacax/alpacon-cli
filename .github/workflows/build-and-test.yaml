name: Build and Test
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

  workflow_call:

# Not github.workflow: under release.yaml it is "Release", shared with the other call.
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A matrix gives one check per leg, so the flat `build-and-test` the ruleset wants is a job.
  test:
    runs-on: ${{ matrix.os }}

    # Windows and macOS each compile in files the others drop, so without a leg of their
    # own those ship untested. ./config is out on Windows: its permission tests all skip.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: ./...
          - os: macos-latest
            packages: ./...
          - os: windows-latest
            packages: ./pkg/selfupdate/... ./cmd ./utils

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the sample CLI script parses as Bash
        if: runner.os == 'Linux'
        run: bash -n sample_test_cli.sh

      - name: Lint the shell scripts with shellcheck
        if: runner.os == 'Linux'
        run: shellcheck sample_test_cli.sh scripts/completions.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Allow Go toolchain auto-download
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Verify go.mod and go.sum are tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build -v .

      - name: Run Tests
        run: go test -race -v -shuffle=on -count=1 ${{ matrix.packages }}

  # The before hook and nfpm contents otherwise first run when a tag is pushed.
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Allow Go toolchain auto-download
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=docker

      - name: Check completion files in the packages
        run: |
          command -v rpm >/dev/null || { sudo apt-get update && sudo apt-get install -y rpm; }
          deb=$(ls dist/*_linux_amd64.deb)
          rpm=$(ls dist/*_linux_amd64.rpm)
          for f in /usr/share/bash-completion/completions/alpacon \
                   /usr/share/fish/vendor_completions.d/alpacon.fish \
                   /usr/share/zsh/vendor-completions/_alpacon; do
            dpkg-deb -c "$deb" | grep -E "^-rw-r--r-- .*\.${f//./\\.}\$"
          done
          for f in /usr/share/bash-completion/completions/alpacon \
                   /usr/share/fish/vendor_completions.d/alpacon.fish \
                   /usr/share/zsh/site-functions/_alpacon; do
            rpm -qlpv "$rpm" | grep -E "^-rw-r--r-- .* ${f//./\\.}\$"
          done
          grep -F 'generate_completions_from_executable(bin/"alpacon", "completion")' dist/homebrew/Formula/alpacon-cli.rb

  build-and-test:
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail unless every matrix leg and the package check passed
        run: '[ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.package.result }}" = "success" ]'

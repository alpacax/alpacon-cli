name: Build and Test
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

  workflow_call:

# Not github.workflow: under release.yaml it is "Release", shared with the other call.
# No cancel on a tag: a re-pushed tag would kill the run goreleaser is waiting on.
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # A matrix gives one check per leg, so the flat `build-and-test` the ruleset wants is a job.
  test:
    runs-on: ${{ matrix.os }}

    # Windows and macOS each compile in files the others drop, so without a leg of their
    # own those ship untested. ./config is out on Windows: its permission tests all skip.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: ./...
          - os: macos-latest
            packages: ./...
          - os: windows-latest
            packages: ./pkg/selfupdate/... ./cmd ./utils

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the sample CLI script parses as Bash
        if: runner.os == 'Linux'
        run: bash -n sample_test_cli.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Allow Go toolchain auto-download
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Verify go.mod and go.sum are tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build -v .

      - name: Run Tests
        run: go test -race -v -shuffle=on -count=1 ${{ matrix.packages }}

  build-and-test:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail unless every matrix leg passed
        run: '[ "${{ needs.test.result }}" = "success" ]'

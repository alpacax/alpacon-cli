version: 2
updates:
  # SHA-pinned actions receive no upstream patch on their own—the pin is
  # exact, so a fix upstream reaches this repo only as a raised pin.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dependencies:
        patterns:
          - "*"
    # smux tagged v2 in 2019 without the /v2 module path, so Go reads it as
    # v2.0.1+incompatible and ranks it above v1.5.57 on the number alone. The
    # v2 tree is seven years older and has no MaxStreamBuffer, so the bump is a
    # downgrade that does not compile. Upstream ships from v1; drop this once a
    # real /v2 module exists.
    ignore:
      - dependency-name: "github.com/xtaci/smux"
        update-types: ["version-update:semver-major"]

version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - testifylint
    - unused
  settings:
    testifylint:
      disable:
        # Pending cleanups tracked in issue #320; enable as each lands.
        - require-error # 175 sites
        - empty         # 29 sites, conversion still undecided
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Printf
        - fmt.Print
        - fmt.Println
  exclusions:
    paths:
      - docs

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - docs

version: "2"

issues:
  # The defaults stop at 50 per linter and 3 per issue type, which hides the
  # size of a sweep; report everything.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - intrange
    - staticcheck
    - testifylint
    - thelper
    - unused
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Printf
        - fmt.Print
        - fmt.Println
  exclusions:
    paths:
      - docs

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - docs
